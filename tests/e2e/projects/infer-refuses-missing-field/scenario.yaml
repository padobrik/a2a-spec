description: infer after a broken producer fails instead of making the read field optional; --allow-missing is the way out.
steps:
  - run: handshake record
  - run: handshake infer --producer triage-agent --consumer resolution-agent --source agents/resolution.py:resolve
    files:
      handshake/specs/triage-agent-to-resolution-agent.yaml: ["  - priority\n"]
  - copy: {changed/triage.py: agents/triage.py}
  - run: handshake record
  - run: handshake infer --producer triage-agent --consumer resolution-agent --source agents/resolution.py:resolve --force
    exit: 1
    output:
      - "FAIL: 'priority' is read by resolution-agent (line 2) but triage-agent never sent it in any snapshot"
      - "No spec written."
    files:
      handshake/specs/triage-agent-to-resolution-agent.yaml: ["  - priority\n"]
  - run: handshake test
    exit: 1
  - run: handshake infer --producer triage-agent --consumer resolution-agent --source agents/resolution.py:resolve --force --allow-missing priority
    output:
      - "allowed by --allow-missing"
