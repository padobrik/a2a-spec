description: Record a Python producer, infer the contract from the consumer, test it.
steps:
  - run: handshake record
    output: ["triage-agent / double_charge recorded", "2 snapshots saved"]
  - run: handshake infer --producer triage-agent --consumer resolution-agent --source agents/resolution.py:resolve
    files:
      handshake/specs/triage-agent-to-resolution-agent.yaml: ["- category", "- priority", "inferred_from: agents/resolution.py:resolve"]
  - run: handshake test --no-semantic
    output: ["PASS triage-agent-to-resolution-agent / double_charge", "2 passed"]
    not_output: ["FAIL"]
  - run: handshake infer --check
    output: ["OK"]
  - run: pytest --handshake handshake/specs
    output: ["3 passed"]
