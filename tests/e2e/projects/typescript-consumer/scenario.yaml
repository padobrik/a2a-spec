description: A TypeScript consumer; infer reads it without Node.js.
requires: [tree_sitter_typescript]
steps:
  - run: handshake record
  - run: handshake infer --producer triage-agent --consumer resolution-agent --source agents/resolution.ts:resolutionAgent
    files:
      handshake/specs/triage-agent-to-resolution-agent.yaml: ["- category", "- priority", "- summary", "inferred_from: agents/resolution.ts:resolutionAgent"]
  - run: handshake test
    output: ["2 passed"]
  - run: handshake infer --check
    output: ["OK"]
