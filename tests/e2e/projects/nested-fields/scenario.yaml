description: The consumer reads a nested field; renaming it inside the object breaks the contract.
steps:
  - run: handshake record
  - run: handshake infer --producer triage-agent --consumer resolution-agent --source agents/resolution.py:resolve
    files:
      handshake/specs/triage-agent-to-resolution-agent.yaml: ["customer:", "- tier", "tier:"]
  - run: handshake test --no-semantic
    output: ["2 passed"]
  - copy: {changed/triage.py: agents/triage.py}
  - run: handshake record
  - run: handshake test --no-semantic
    exit: 1
    output: ["'tier' is a required property"]
