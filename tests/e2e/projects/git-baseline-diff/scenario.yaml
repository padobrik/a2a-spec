description: diff compares new snapshots with the ones committed in git.
steps:
  - run: handshake record
  - run: git init -q
  - run: git add handshake.yaml agents handshake
  - run: git commit -q -m baseline
  - copy: {changed/triage.py: agents/triage.py}
  - run: handshake record
  - run: handshake diff --base HEAD
    exit: 2
    output: ["Field 'priority' was removed", "Field 'urgency' was added"]
