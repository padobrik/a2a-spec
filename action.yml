name: a2a-spec contract tests
description: Test agent-to-agent contracts with a2a-spec. Runs a2aspec infer --check and a2aspec test with pull request annotations.
author: padobrik
branding:
  icon: check-circle
  color: purple

inputs:
  package:
    description: pip requirement to install, for example "a2a-spec[semantic]==0.5.0".
    default: a2a-spec
  python-version:
    description: Python version to use.
    default: "3.12"
  working-directory:
    description: Directory that contains the a2a-spec project.
    default: .
  config:
    description: Path to a2a-spec.yaml, relative to working-directory. Empty uses the default lookup.
    default: ""
  check-inferred:
    description: Run a2aspec infer --check before the tests ("true" or "false").
    default: "true"
  args:
    description: Extra arguments for a2aspec test, for example "--no-semantic".
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install a2a-spec
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: python -m pip install "$PACKAGE"

    - name: Check inferred specs
      if: inputs.check-inferred == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
      run: a2aspec infer --check ${CONFIG:+--config "$CONFIG"}

    - name: Test contracts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        ARGS: ${{ inputs.args }}
      # ARGS is split into words on purpose so it can carry several flags.
      run: a2aspec test --format github ${CONFIG:+--config "$CONFIG"} $ARGS
