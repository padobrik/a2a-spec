name: agent-handshake contract tests
description: Test agent-to-agent contracts with agent-handshake. Runs handshake infer --check and handshake test with pull request annotations.
author: padobrik
branding:
  icon: check-circle
  color: purple

inputs:
  package:
    description: pip requirement to install, for example "agent-handshake[typescript]==0.10.0".
    default: agent-handshake
  python-version:
    description: Python version to use.
    default: "3.12"
  working-directory:
    description: Directory that contains the agent-handshake project.
    default: .
  config:
    description: Path to handshake.yaml, relative to working-directory. Empty uses the default lookup.
    default: ""
  check-inferred:
    description: Run handshake infer --check before the tests ("true" or "false").
    default: "true"
  args:
    description: Extra arguments for handshake test, for example "--fail-fast".
    default: ""

outputs:
  test-exit-code:
    description: Exit code of handshake test (0 when every contract passed, 1 when one failed, 2 for a configuration or input error). Empty when that step did not run, for example because the installation failed.
    value: ${{ steps.test.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agent-handshake
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: python -m pip install "$PACKAGE"

    - name: Check inferred specs
      if: inputs.check-inferred == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
      run: handshake infer --check ${CONFIG:+--config "$CONFIG"}

    - name: Test contracts
      id: test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        ARGS: ${{ inputs.args }}
      # ARGS is split into words on purpose so it can carry several flags.
      run: |
        status=0
        handshake test --format github ${CONFIG:+--config "$CONFIG"} $ARGS || status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        exit "$status"
