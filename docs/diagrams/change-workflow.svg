<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="t d">
  <title id="t">When you change an agent</title>
  <desc id="d">Change the producer, run a2aspec record, a2aspec diff and a2aspec test. If the tests pass, commit. If they fail and the change was not intended, fix the producer and record again. If the change was intended, update the consumer, run a2aspec infer --force, then commit. Do not record again only to make a failed test pass.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .line { stroke: #8b949e; stroke-width: 2; fill: none; }
      .note { fill: #8b949e; font-size: 13px; }
      .label { fill: #ffffff; font-size: 15px; font-weight: 600; }
      .cmd { fill: #e6edf3; font-size: 14px; }
      .small { fill: #ffffff; fill-opacity: 0.85; font-size: 13px; }
    </style>
  </defs>

  <!-- row 1: steps -->
  <rect x="20" y="30" width="180" height="56" rx="12" fill="#6366f1"/>
  <text x="110" y="64" text-anchor="middle" class="sans label">Change the producer</text>
  <path d="M202 58 H236" class="line" marker-end="url(#arrow)"/>

  <rect x="240" y="30" width="180" height="56" rx="12" fill="#1f2937" stroke="#8b949e" stroke-width="1.5"/>
  <text x="330" y="63" text-anchor="middle" class="mono cmd">a2aspec record</text>
  <path d="M422 58 H456" class="line" marker-end="url(#arrow)"/>

  <rect x="460" y="30" width="180" height="56" rx="12" fill="#1f2937" stroke="#8b949e" stroke-width="1.5"/>
  <text x="550" y="63" text-anchor="middle" class="mono cmd">a2aspec diff</text>
  <path d="M642 58 H676" class="line" marker-end="url(#arrow)"/>

  <rect x="680" y="30" width="180" height="56" rx="12" fill="#1f2937" stroke="#8b949e" stroke-width="1.5"/>
  <text x="770" y="63" text-anchor="middle" class="mono cmd">a2aspec test</text>

  <!-- pass branch -->
  <path d="M820 88 V226" class="line" marker-end="url(#arrow)"/>
  <rect x="832" y="140" width="44" height="22" rx="11" fill="#16a34a"/>
  <text x="854" y="156" text-anchor="middle" class="sans" fill="#ffffff" font-size="12" font-weight="600">pass</text>

  <!-- fail branch -->
  <path d="M720 88 V165 H594" class="line" marker-end="url(#arrow)"/>
  <rect x="688" y="110" width="40" height="22" rx="11" fill="#dc2626"/>
  <text x="708" y="126" text-anchor="middle" class="sans" fill="#ffffff" font-size="12" font-weight="600">fail</text>

  <rect x="330" y="140" width="260" height="50" rx="12" fill="#b45309"/>
  <text x="460" y="171" text-anchor="middle" class="sans label">Is the change intended?</text>

  <!-- no: fix the producer, record again -->
  <path d="M328 165 H130 V226" class="line" marker-end="url(#arrow)"/>
  <text x="230" y="157" text-anchor="middle" class="sans note">no</text>
  <rect x="30" y="230" width="200" height="50" rx="12" fill="#30363d" stroke="#57606a"/>
  <text x="130" y="261" text-anchor="middle" class="sans label">Fix the producer</text>
  <path d="M28 255 H10 V108 H310 V90" class="line" marker-end="url(#arrow)"/>
  <text x="18" y="126" class="sans note">record again</text>

  <!-- yes: update the consumer, infer -->
  <path d="M460 192 V226" class="line" marker-end="url(#arrow)"/>
  <text x="472" y="214" class="sans note">yes</text>
  <rect x="340" y="230" width="240" height="56" rx="12" fill="#0d9488"/>
  <text x="460" y="254" text-anchor="middle" class="sans label">Update the consumer</text>
  <text x="460" y="275" text-anchor="middle" class="mono small">a2aspec infer --force</text>
  <path d="M582 258 H736" class="line" marker-end="url(#arrow)"/>

  <!-- commit -->
  <rect x="740" y="230" width="130" height="56" rx="12" fill="#16a34a"/>
  <text x="805" y="254" text-anchor="middle" class="sans label">Commit</text>
  <text x="805" y="275" text-anchor="middle" class="sans small">specs, snapshots</text>

  <!-- rule -->
  <text x="440" y="324" text-anchor="middle" class="sans" fill="#e5534b" font-size="14" font-weight="600">Do not record again only to make a failed test pass.</text>
</svg>
