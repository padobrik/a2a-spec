<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="t d">
  <title id="t">How a2a-spec works</title>
  <desc id="d">a2aspec record saves the producer output as snapshots. a2aspec infer reads the consumer code and writes a spec. a2aspec test or pytest checks the snapshots against the spec and gives pass or fail, with no LLM calls.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .line { stroke: #8b949e; stroke-width: 2; fill: none; }
      .note { fill: #8b949e; font-size: 13px; }
      .kicker { fill: #ffffff; fill-opacity: 0.8; font-size: 12px; letter-spacing: 0.08em; }
      .title { fill: #ffffff; font-size: 20px; font-weight: 600; }
      .sub { fill: #ffffff; fill-opacity: 0.85; font-size: 13px; }
      .cmd { fill: #e6edf3; font-size: 13px; }
    </style>
  </defs>

  <!-- agents -->
  <rect x="60" y="30" width="260" height="76" rx="14" fill="#6366f1"/>
  <text x="190" y="58" text-anchor="middle" class="sans kicker">PRODUCER</text>
  <text x="190" y="86" text-anchor="middle" class="sans title">agent A</text>

  <rect x="560" y="30" width="260" height="76" rx="14" fill="#0d9488"/>
  <text x="690" y="58" text-anchor="middle" class="sans kicker">CONSUMER</text>
  <text x="690" y="86" text-anchor="middle" class="sans title">agent B</text>

  <path d="M322 68 H554" class="line" marker-end="url(#arrow)"/>
  <text x="438" y="58" text-anchor="middle" class="sans note">output</text>

  <!-- record / infer -->
  <path d="M190 108 V186" class="line" marker-end="url(#arrow)"/>
  <rect x="113" y="133" width="154" height="28" rx="14" fill="#30363d" stroke="#57606a"/>
  <text x="190" y="152" text-anchor="middle" class="mono cmd">a2aspec record</text>
  <text x="282" y="152" class="sans note">calls agent A once</text>

  <path d="M690 108 V186" class="line" marker-end="url(#arrow)"/>
  <rect x="617" y="133" width="146" height="28" rx="14" fill="#30363d" stroke="#57606a"/>
  <text x="690" y="152" text-anchor="middle" class="mono cmd">a2aspec infer</text>
  <text x="602" y="152" text-anchor="end" class="sans note">reads agent B's code</text>

  <!-- artifacts -->
  <rect x="80" y="190" width="220" height="70" rx="12" fill="#475569"/>
  <text x="190" y="220" text-anchor="middle" class="sans title" style="font-size:18px">Snapshots</text>
  <text x="190" y="243" text-anchor="middle" class="sans sub">JSON, committed to git</text>

  <rect x="580" y="190" width="220" height="70" rx="12" fill="#475569"/>
  <text x="690" y="220" text-anchor="middle" class="sans title" style="font-size:18px">Spec</text>
  <text x="690" y="243" text-anchor="middle" class="sans sub">fields agent B needs</text>

  <!-- test -->
  <path d="M190 262 V332 H326" class="line" marker-end="url(#arrow)"/>
  <path d="M690 262 V332 H554" class="line" marker-end="url(#arrow)"/>
  <rect x="330" y="300" width="220" height="64" rx="14" fill="#1f2937" stroke="#8b949e" stroke-width="1.5"/>
  <text x="440" y="328" text-anchor="middle" class="mono cmd" style="font-size:15px">a2aspec test · pytest</text>
  <text x="440" y="350" text-anchor="middle" class="sans sub">no LLM calls, no API keys</text>

  <!-- outcomes -->
  <path d="M440 366 V380 H350 V392" class="line" marker-end="url(#arrow)"/>
  <path d="M440 380 H530 V392" class="line" marker-end="url(#arrow)"/>
  <rect x="300" y="396" width="100" height="32" rx="16" fill="#16a34a"/>
  <text x="350" y="417" text-anchor="middle" class="sans" fill="#ffffff" font-size="14" font-weight="600">pass</text>
  <rect x="480" y="396" width="100" height="32" rx="16" fill="#dc2626"/>
  <text x="530" y="417" text-anchor="middle" class="sans" fill="#ffffff" font-size="14" font-weight="600">fail</text>
  <text x="594" y="417" class="sans note">names the missing or wrong field</text>
</svg>
