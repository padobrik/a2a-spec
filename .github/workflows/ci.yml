name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,langchain,typescript]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Test with coverage
        run: pytest tests/ -v --tb=short --cov=agent_handshake --cov-report=term-missing

      - name: Verify clean import (no optional deps)
        run: |
          pip install -e "."
          python -c "import agent_handshake; print(agent_handshake.__version__)"
          python -c "from agent_handshake import load_spec, validate_output, FunctionAdapter, SnapshotStore"

      - name: Verify no unsafe yaml.load
        run: |
          if grep -rn "yaml\.load\b" src/; then
            echo "FAIL: unsafe yaml.load found"
            exit 1
          else
            echo "PASS: only yaml.safe_load used"
          fi

  action:
    name: GitHub Action on the example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run the repository action with this commit
        uses: ./
        with:
          package: ${{ github.workspace }}
          working-directory: examples/customer_support
          config: handshake/handshake.yaml
          args: --no-semantic
