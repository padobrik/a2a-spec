name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Ubuntu jobs keep the names that branch protection requires.
    name: Test (Python ${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,typescript]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Type check
        run: mypy src/

      # coverage run instead of pytest --cov: the package's pytest plugin is
      # imported before pytest-cov starts, which hid module-level lines.
      - name: Test with coverage
        run: coverage run -m pytest tests/ -v --tb=short

      - name: Coverage report (fails under the threshold in pyproject.toml)
        run: coverage report

      - name: Verify clean import (no optional deps)
        run: |
          pip install -e "."
          python -c "import agent_handshake; print(agent_handshake.__version__)"
          python -c "from agent_handshake import load_spec, validate_output, FunctionAdapter, SnapshotStore"

      - name: Verify no unsafe yaml.load
        run: |
          if grep -rn "yaml\.load\b" src/; then
            echo "FAIL: unsafe yaml.load found"
            exit 1
          else
            echo "PASS: only yaml.safe_load used"
          fi

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the workflow linters
        run: pip install "zizmor==1.30.0" "actionlint-py==1.7.12.25"

      # Syntax, expressions and contexts; shell scripts through shellcheck.
      - name: Lint the workflows with actionlint
        run: actionlint

      # Unpinned actions, credentials left in checkouts, template injection, and so on.
      # Rules are configured in .github/zizmor.yml.
      - name: Audit the workflows and the action with zizmor
        run: zizmor --offline .github/workflows action.yml

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The flake builds the package and runs the full test suite, so this
      # job is the regression gate for flake.nix itself.
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Build the package and check the flake
        run: nix build .#default && nix flake check

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check the package metadata
        run: twine check --strict dist/*

      # Outside the checkout, so only what the wheel ships is importable.
      - name: Install the wheel in a clean environment and run it
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/handshake --version
          wheel-env/bin/handshake skill | grep -q "name: agent-handshake"
          wheel-env/bin/python -c "import agent_handshake, agent_handshake.infer.ts_consumer"

      # The scenarios in tests/e2e run the wheel's handshake command and plugin.
      - name: Run the end-to-end scenarios against the wheel
        run: |
          python -m venv "$RUNNER_TEMP/e2e-env"
          "$RUNNER_TEMP/e2e-env/bin/pip" install "$(ls dist/*.whl)[typescript]" pytest
          "$RUNNER_TEMP/e2e-env/bin/python" -m pytest tests/e2e -v -p no:cacheprovider

  action:
    name: GitHub Action on the example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run the repository action with this commit
        uses: ./
        with:
          package: ${{ github.workspace }}
          working-directory: examples/customer_support
          config: handshake/handshake.yaml

      # Replays the recorded model output: no API key and no model SDK needed.
      - name: Run the repository action on the LLM example
        uses: ./
        with:
          package: ${{ github.workspace }}
          working-directory: examples/llm_support

      # The last --format wins, so this run adds no annotations to the PR.
      - name: Run the repository action on a broken contract
        id: broken
        continue-on-error: true
        uses: ./
        with:
          package: ${{ github.workspace }}
          working-directory: tests/e2e/projects/producer-renames-field
          check-inferred: "false"
          args: --format console

      # Exit code 1 from handshake test, not a failed installation.
      - name: Check that the contract test failed the action
        if: steps.broken.outputs.test-exit-code != '1'
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          TEST_EXIT_CODE: ${{ steps.broken.outputs.test-exit-code }}
        run: |
          echo "::error::Expected handshake test to exit 1 on the broken contract; step outcome $OUTCOME, test exit code '$TEST_EXIT_CODE'"
          exit 1
