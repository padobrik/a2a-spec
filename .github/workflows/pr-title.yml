name: PR title

# Pull requests are merged with their title in the history, so it follows the
# conventional commit form that the commit hooks enforce for local commits.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions: {}

jobs:
  title:
    name: PR title
    # Dependabot writes its own titles (conventional, but often over 72 characters).
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check the conventional commit form
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ]'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title '$TITLE' is not 'type(scope): subject' (types: feat, fix, docs, refactor, perf, test, build, ci, chore, revert)"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters; keep it at 72 or fewer"
            exit 1
          fi
          echo "PR title OK: $TITLE"
