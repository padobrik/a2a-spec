name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e "."

      - name: Verify tag matches __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import a2a_spec; print(a2a_spec.__version__)")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag $TAG != __version__ $VER" && exit 1
          fi

      - name: Build
        run: pip install build && python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
