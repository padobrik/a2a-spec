name: Release

# Push a tag vX.Y.Z on main to release. The tag must match the version in
# pyproject.toml and src/agent_handshake/__init__.py, and CHANGELOG.md must
# have a section for it; that section becomes the GitHub release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  check:
    name: Check version and CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0  # full history, to check that the tag is on main

      - name: Tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to a commit that is not on main"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          MODULE=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/agent_handshake/__init__.py)
          if [ "${TAG#v}" != "$PYPROJECT" ] || [ "${TAG#v}" != "$MODULE" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml ($PYPROJECT) and __version__ ($MODULE)"
            exit 1
          fi

      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/changelog_section.py "$TAG" > release-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Publish to PyPI
    needs: [ci, check]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build
        run: pip install build && python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "$TAG" --notes-file release-notes.md

  verify:
    name: Install from PyPI
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # The PyPI index can take a few minutes to show a new version.
      - name: Install the published version and run it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          python -m venv pypi-env
          for attempt in $(seq 1 30); do
            if pypi-env/bin/pip install --no-cache-dir "agent-handshake==$VERSION"; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::agent-handshake==$VERSION cannot be installed from PyPI"
              exit 1
            fi
            sleep 20
          done
          pypi-env/bin/handshake --version | grep -qx "agent-handshake $VERSION"
