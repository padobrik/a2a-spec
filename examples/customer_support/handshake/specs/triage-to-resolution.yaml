spec:
  name: triage-to-resolution
  version: "1.0"
  producer: triage-agent
  consumer: resolution-agent
  description: "The resolution agent expects structured triage output"

  structural:
    type: object
    required:
      - category
      - summary
      - confidence
    properties:
      category:
        type: string
        enum: [billing, shipping, product, general]
      summary:
        type: string
        minLength: 10
        maxLength: 500
      confidence:
        type: number
        minimum: 0.0
        maximum: 1.0
      priority:
        type: string
        enum: [low, medium, high]

  policy:
    - rule: no_internal_ticket_ids
      description: "Internal ticket IDs such as INT-123456 must not reach the customer"
      method: regex
      patterns:
        - '\bINT-\d{6}\b'
