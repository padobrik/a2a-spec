test_suite:
  name: llm-support

scenarios:
  - name: double_charge
    input:
      message: "I was charged twice for order #4411. Please refund the second payment today."
    expectations:
      triage-agent:
        category: billing

  - name: late_parcel
    input:
      message: "My parcel was due last Monday and the tracking page has not changed for a week."
    expectations:
      triage-agent:
        category: shipping

  - name: broken_kettle
    input:
      message: "The kettle I bought stopped heating after two days. This is ridiculous."
    expectations:
      triage-agent:
        category: product

  - name: password_reset
    input:
      message: "I can't log in. The password reset email never arrives."

  - name: opening_hours
    input:
      message: "Hi! Do you ship to Canada, and how long does it usually take?"
