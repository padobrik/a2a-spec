# Written by hand: rules about the LLM output that the consumer code cannot show.
spec:
  name: triage-quality
  version: "1.0"
  producer: triage-agent
  consumer: resolution-agent
  description: "The triage summary is a sentence and leaks no internal ticket IDs"

  structural:
    type: object
    required: [summary]
    properties:
      summary:
        type: string
        minLength: 10

  policy:
    - rule: no_internal_ticket_ids
      method: regex
      patterns: ['\bINT-\d{6}\b']
