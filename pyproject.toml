[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-handshake"
version = "0.8.0"
description = "Contract tests for agent handoffs: record what one agent returns, infer what the next one reads, and check it in CI without LLM calls."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Fedor Kabachenko", email = "fkabachenko@gmail.com" },
]
keywords = ["a2a", "agents", "testing", "llm", "multi-agent", "contract-testing", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "jsonschema>=4.20,<5.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0,<6.0",
    "numpy>=1.26,<3.0",
]
langchain = [
    "langchain-core>=0.2,<2.0",
]
typescript = [
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<3.0",
    "pre-commit>=3.7,<5.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.20",
    "a2a-sdk[http-server]>=1.0,<2.0",
]
all = [
    "agent-handshake[semantic,langchain,typescript,dev]",
]

[project.scripts]
handshake = "agent_handshake.cli.main:main"

[project.entry-points.pytest11]
agent_handshake = "agent_handshake.pytest_plugin"

[project.urls]
Homepage = "https://github.com/padobrik/agent-handshake"
Documentation = "https://github.com/padobrik/agent-handshake/tree/main/docs"
Repository = "https://github.com/padobrik/agent-handshake"
Issues = "https://github.com/padobrik/agent-handshake/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_handshake"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "ANN", "B", "SIM",
    "RUF",  # ruff-specific checks, including unused noqa comments
    "S",    # security (bandit)
    "BLE",  # blind except Exception
    "PT",   # pytest style
    "C4", "PIE", "PTH", "RET",
]
ignore = [
    "ANN401", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN206",
    # B904 removed: all re-raised exceptions now use 'from e' to preserve tracebacks
    "B905",   # zip() strict — not needed for guaranteed-same-length AST nodes
    "SIM108", # ternary operator — readability preference
    "SIM102", # nested if — readability preference
    "RUF022", # unsorted __all__ — exports are grouped by topic on purpose
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, run known commands and parse their own JUnit output.
"tests/*" = ["ANN", "S101", "S603", "S607", "S314"]
# Pytest style rules are for tests; src has a CLI command named test.
"src/*" = ["PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["agent_handshake"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "numpy",
    "langchain_core.*",
]
ignore_missing_imports = true
