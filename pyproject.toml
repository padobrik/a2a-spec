[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-spec"
version = "0.1.0"
description = "The open specification for testing, validating, and guaranteeing agent-to-agent interactions."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["a2a", "agents", "testing", "llm", "multi-agent", "contract-testing", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "jsonschema>=4.20,<5.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0,<4.0",
    "numpy>=1.26,<3.0",
]
langchain = [
    "langchain-core>=0.2,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.20",
]
all = [
    "a2a-spec[semantic,langchain,dev]",
]

[project.scripts]
a2aspec = "a2a_spec.cli.main:main"

[project.urls]
Homepage = "https://github.com/yourorg/a2a-spec"
Documentation = "https://github.com/yourorg/a2a-spec/tree/main/docs"
Repository = "https://github.com/yourorg/a2a-spec"
Issues = "https://github.com/yourorg/a2a-spec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_spec"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = [
    "ANN401", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN206",
    # B904 removed: all re-raised exceptions now use 'from e' to preserve tracebacks
    "B905",   # zip() strict — not needed for guaranteed-same-length AST nodes
    "SIM108", # ternary operator — readability preference
    "SIM102", # nested if — readability preference
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
