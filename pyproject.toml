[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-handshake"
version = "1.0.0.dev0"
description = "Check that what your agent is told matches the tools it actually has."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Fedor Kabachenko", email = "fkabachenko@gmail.com" },
]
keywords = ["agents", "llm", "tools", "prompts", "testing", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<3.0",
    "pre-commit>=3.7,<5.0",
    "types-PyYAML>=6.0",
]
all = [
    "agent-handshake[dev]",
]

[project.scripts]
handshake = "agent_handshake.cli.main:main"

[project.urls]
Homepage = "https://github.com/padobrik/agent-handshake"
Documentation = "https://github.com/padobrik/agent-handshake/tree/main/docs"
Repository = "https://github.com/padobrik/agent-handshake"
Issues = "https://github.com/padobrik/agent-handshake/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_handshake"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "ANN", "B", "SIM",
    "RUF",  # ruff-specific checks, including unused noqa comments
    "S",    # security (bandit)
    "BLE",  # blind except Exception
    "PT",   # pytest style
    "C4", "PIE", "PTH", "RET",
]
ignore = [
    "ANN401", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN206",
    # B904 removed: all re-raised exceptions now use 'from e' to preserve tracebacks
    "B905",   # zip() strict — not needed for guaranteed-same-length AST nodes
    "SIM108", # ternary operator — readability preference
    "SIM102", # nested if — readability preference
    "RUF022", # unsorted __all__ — exports are grouped by topic on purpose
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, run known commands and parse their own JUnit output.
"tests/*" = ["ANN", "S101", "S603", "S607", "S314"]
# Pytest style rules are for tests; src has a CLI command named test.
"src/*" = ["PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent_handshake"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

