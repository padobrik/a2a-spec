project: openai-agents-python
repository: https://github.com/openai/openai-agents-python
commit: 17d994bd3045dae71acda676a4ef4762ed8ecd94
cases:
  - id: planner-to-search
    links: [L1]
    producer: planner
    consumer: search
    source: examples/financial_research_agent/manager.py:_perform_searches
    note: Attribute reads on FinancialSearchPlan; each item goes to the helper _search, which reads query and reason.
    expected:
      - path: searches
        at: examples/financial_research_agent/manager.py:143
      - path: searches[].query
        at: examples/financial_research_agent/manager.py:171
      - path: searches[].reason
        at: examples/financial_research_agent/manager.py:171

  - id: search-to-writer
    links: [L2]
    producer: search
    consumer: writer
    source: examples/financial_research_agent/manager.py:_search
    note: The search output is a local variable in _search (from Runner.run at line 173), not a parameter; then model_dump into a JSON prompt.
    expected:
      - path: summary
        at: examples/financial_research_agent/manager.py:181

  - id: search-to-verifier
    links: [L3]
    producer: search
    consumer: verifier
    source: examples/financial_research_agent/manager.py:_verification_input
    note: search_results is the third parameter; the items are the FinancialSearchEvidence wrappers built from the search runs.
    expected:
      - path: sources
        at: examples/financial_research_agent/manager.py:269
      - path: sources[].url
        at: examples/financial_research_agent/manager.py:269

  - id: financials-to-writer
    links: [L4]
    producer: financials
    consumer: writer
    source: examples/financial_research_agent/manager.py:_summary_extractor
    note: custom_output_extractor callback for as_tool; reads run_result.final_output.summary.
    expected:
      - path: summary
        at: examples/financial_research_agent/manager.py:65

  - id: risk-to-writer
    links: [L5]
    producer: risk
    consumer: writer
    source: examples/financial_research_agent/manager.py:_summary_extractor
    note: Same function as financials-to-writer, used by a second agent tool.
    expected:
      - path: summary
        at: examples/financial_research_agent/manager.py:65

  - id: writer-to-verifier
    links: [L6]
    producer: writer
    consumer: verifier
    source: examples/financial_research_agent/manager.py:_verification_input
    note: report is the second parameter and is only dumped whole with model_dump.
    expected: []

  - id: verifier-to-reviser
    links: [L7]
    producer: verifier
    consumer: writer
    source: examples/financial_research_agent/manager.py:_produce_verified_report
    note: The verification result is a local variable (returned by _verify_report); the rest goes whole into the revision prompt.
    expected:
      - path: verified
        at: examples/financial_research_agent/manager.py:113

  - id: writer-to-reviser
    links: [L8]
    producer: writer
    consumer: writer
    source: examples/financial_research_agent/manager.py:_revise_report
    note: report is the second parameter and is only dumped whole with model_dump_json.
    expected: []

  - id: rb-planner-to-search
    links: [R1]
    producer: rb_planner
    consumer: rb_search
    source: examples/research_bot/manager.py:_perform_searches
    note: Attribute reads on WebSearchPlan; each item goes to the helper _search.
    expected:
      - path: searches
        at: examples/research_bot/manager.py:71
      - path: searches[].query
        at: examples/research_bot/manager.py:95
      - path: searches[].reason
        at: examples/research_bot/manager.py:95

  - id: rb-search-to-writer
    links: [R2]
    producer: rb_search
    consumer: rb_writer
    source: examples/research_bot/manager.py:_write_report
    note: Free text; search_results is a list of strings put whole into an f-string prompt.
    expected: []
