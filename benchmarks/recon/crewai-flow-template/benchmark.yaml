project: CrewAI flow template (+ crew template)
repository: https://github.com/crewAIInc/crewAI
commit: cf9f08a4a1e9bb354485daf0feeda0963043b019
cases:
  - id: plan_content
    links: [L1]
    producer: trigger
    consumer: plan_content
    source: lib/cli/src/crewai_cli/templates/flow/main.py:plan_content
    replace: [["{{folder_name}}", "my_flow"]]
    note: external trigger payload, read with .get("topic", "AI Agents")
    expected:
      - path: topic
        at: lib/cli/src/crewai_cli/templates/flow/main.py:25

  - id: generate_content
    links: [L2, L6]
    producer: plan_content
    consumer: generate_content
    source: lib/cli/src/crewai_cli/templates/flow/main.py:generate_content
    replace: [["{{folder_name}}", "my_flow"]]
    note: topic comes from the flow state set by plan_content (self.state.topic); raw comes from the ContentCrew result (CrewOutput.raw)
    expected:
      - path: topic
        at: lib/cli/src/crewai_cli/templates/flow/main.py:38
      - path: raw
        at: lib/cli/src/crewai_cli/templates/flow/main.py:42

  - id: save_content
    links: [L7]
    producer: generate_content
    consumer: save_content
    source: lib/cli/src/crewai_cli/templates/flow/main.py:save_content
    replace: [["{{folder_name}}", "my_flow"]]
    note: reads self.state.final_post
    expected:
      - path: final_post
        at: lib/cli/src/crewai_cli/templates/flow/main.py:50

  - id: content_prompts
    links: [L3]
    producer: generate_content_inputs
    consumer: planning_task
    source: null
    note: kickoff inputs rendered into {topic} placeholders of all three agents and tasks by the framework
    expected:
      - path: topic
        at: lib/cli/src/crewai_cli/templates/flow/crews/content_crew/config/tasks.yaml:3

  - id: writer_context
    links: [L4]
    producer: planner
    consumer: writer
    source: null
    note: planner output reaches the writer as joined free text (crew.py _get_context)
    expected:
      - path: raw
        at: lib/cli/src/crewai_cli/templates/flow/crews/content_crew/config/tasks.yaml:20

  - id: editor_context
    links: [L5]
    producer: writer
    consumer: editor
    source: null
    note: planner and writer outputs reach the editor as joined free text (crew.py _get_context)
    expected:
      - path: raw
        at: lib/cli/src/crewai_cli/templates/flow/crews/content_crew/config/tasks.yaml:36

  - id: crew_prompts
    links: [C1]
    producer: crew_run_inputs
    consumer: research_task
    source: null
    note: crew template; inputs rendered into prompt placeholders, trigger payload appended to the first task by the framework
    expected:
      - path: topic
        at: lib/cli/src/crewai_cli/templates/crew/config/tasks.yaml:3
      - path: current_year
        at: lib/cli/src/crewai_cli/templates/crew/config/tasks.yaml:5
      - path: crewai_trigger_payload
        at: lib/crewai/src/crewai/task.py:988

  - id: reporting_context
    links: [C2]
    producer: researcher
    consumer: reporting_analyst
    source: null
    note: crew template; research output reaches the reporting task as joined free text
    expected:
      - path: raw
        at: lib/cli/src/crewai_cli/templates/crew/config/tasks.yaml:12
