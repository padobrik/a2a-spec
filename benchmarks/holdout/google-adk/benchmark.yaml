  - id: evaluator-to-escalation-checker
    links: [L1]
    producer: research_evaluator
    consumer: escalation_checker
    source: core/python/deep-search/app/agent.py:_run_async_impl
    note: The Feedback output is stored as a dict under the state key research_evaluation (output_key, line 329). EscalationChecker._run_async_impl reads it from ctx.session.state (line 181) and checks .get("grade"). The truthiness test on the whole dict is not a field.
    expected:
      - path: grade
        at: core/python/deep-search/app/agent.py:182

  - id: evaluator-to-enhanced-search
    links: [L2]
    producer: research_evaluator
    consumer: enhanced_search_executor
    source: null
    note: No project function receives it. The evaluator's JSON reaches the model through the conversation history; the instruction names the state key research_evaluation (line 343) and tells the model to run every query in follow_up_queries (line 344). It is not a {placeholder}, so nothing is substituted.
    expected:
      - path: follow_up_queries
        at: core/python/deep-search/app/agent.py:344

